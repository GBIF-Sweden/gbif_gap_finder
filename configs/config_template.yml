# configs/config_template.yml
# ============================================================================
# GBIF Gap Finder — Project Configuration Template
# ============================================================================
# Copy this file to configs/config_{CC}.yml (e.g. config_NO.yml)
# Fill in all TODO items, then run:
#   Sys.setenv(GBIF_GAP_COUNTRY = "CC")
#   source("scripts/00_setup.R")
#   source("scripts/01_download_raw_data.R")
#
# Data: data/{CC}/raw/ and data/{CC}/proc/
# Grids: data/shared/grids/ (shared across European countries)
# ============================================================================

# ============================================================================
# Country Identification
# ============================================================================
country:
  code: ""                           # TODO: ISO 3166-1 alpha-2 (e.g. "NO")
  name: ""                           # TODO: e.g. "Norway"
  gbif_country_code: ""              # TODO: same as code
  timezone: ""                       # TODO: e.g. "Europe/Oslo"

# ============================================================================
# Administrative Boundaries (optional)
# ============================================================================
admin_boundaries:
  enabled: true
  country_code_iso3: ""              # TODO: ISO 3166-1 alpha-3 (e.g. "NOR")
  levels: [1, 2]
  force_download: false

# ============================================================================
# National Taxonomy Backbone
# ============================================================================
# Find your national checklist: https://www.gbif.org/dataset/search?type=CHECKLIST
taxonomy:
  name: ""                           # TODO: e.g. "Nortaxa"
  dataset_key: ""                    # TODO: GBIF dataset UUID
  doi: ""                            # TODO: dataset DOI
  export_url: ""                     # TODO: DwC-A download URL

# ============================================================================
# National Red List (optional)
# ============================================================================
# Set enabled: false if no red list DwC-A is available
redlist:
  enabled: false                     # TODO: set true if available
  dataset_key: ""                    # TODO: GBIF dataset UUID
  doi: ""                            # TODO: dataset DOI
  export_url: ""                     # TODO: DwC-A download URL

# ============================================================================
# National Invasive Species Registry (optional)
# ============================================================================
# Set enabled: false if no invasive species checklist is available as DwC-A.
# Search for your country's checklist:
#   https://www.gbif.org/dataset/search?q=invasive&publishingCountry={CC}&type=CHECKLIST
invasives:
  enabled: false                     # TODO: set true if available
  dataset_key: ""                    # TODO: GBIF dataset UUID
  doi: ""                            # TODO: dataset DOI
  export_url: ""                     # TODO: DwC-A download URL (IPT archive)
  name: ""                           # TODO: e.g. "National Invasive Species Registry"

# ============================================================================
# Sensitive Species List (optional)
# ============================================================================
# Set enabled: false if no sensitive/restricted species list is available.
# Search for your country's list:
#   https://www.gbif.org/dataset/search?q=sensitive&publishingCountry={CC}&type=CHECKLIST
sensitive:
  enabled: false                     # TODO: set true if available
  dataset_key: ""                    # TODO: GBIF dataset UUID
  doi: ""                            # TODO: dataset DOI
  export_url: ""                     # TODO: DwC-A download URL (IPT archive)
  name: ""                           # TODO: e.g. "Restricted Access Species List"

# ============================================================================
# GBIF Occurrence Cubes (SQL API)
# ============================================================================
# Download via https://www.gbif.org/occurrence/download/sql
# Script 01 prints the SQL query for your country.
# Unzip and place CSVs in data/{CC}/raw/cubes/
# No download_key needed here. 01a's automation records the key of each download
# to the VERSION-CONTROLLED file provenance/cube_downloads_{CC}.yml and 01b
# resolves DOI + citation from it, so provenance auto-tracks and stays in git.
# To pin a specific historical download, add an override, e.g.:
#   grid10km: { download_key: "0012345-260409193756587" }
cubes:
  source: "sql_api"

# ============================================================================
# Paths (optional overrides)
# ============================================================================
# Uncomment only if you need non-standard locations.
# Otherwise globals.R derives paths from data/{country_code}/raw/.
#
# paths:
#   gbif_cube_dir: "data/{CC}/raw/cubes"
#   taxonomy_dir:  "data/{CC}/raw/taxonomy"
#   redlist_dir:   "data/{CC}/raw/redlist"
#   invasives_dir: "data/{CC}/raw/invasives"
#   sensitive_dir: "data/{CC}/raw/sensitive"
#   admin_dir:     "data/{CC}/raw/admin"

# ============================================================================
# Files
# ============================================================================
files:
  grids:
    grid10km: "Grid_ETRS89-LAEA_10K.shp"
    grid50km: "EEA_50km_grid_v2024.gpkg"

  cubes:
    grid10km: "cube_10km.csv"
    grid50km: "cube_50km.csv"

  taxonomy:
    taxonomy_taxon: "Taxon.csv"      # TODO: verify — may be taxon.txt
    taxonomy_distr: "Distribution.csv"  # TODO: verify — may be SpeciesDistribution.csv

  redlist:
    redlist_taxon: "taxon.txt"       # TODO: verify after download
    redlist_distr: "distribution.txt"

  invasives:
    invasives_taxon: "taxon.txt"     # TODO: verify after download
    invasives_distr: "distribution.txt"

  sensitive:
    sensitive_taxon: "taxon.txt"     # TODO: verify after download
    sensitive_distr: "distribution.txt"

# ============================================================================
# Analysis Parameters
# ============================================================================
parameters:
  crs: 3035                          # ETRS89-LAEA (EEA standard)
                                     # Change for non-European countries

  spatial:
    quantile_thresholds: [0.05, 0.10, 0.25]

  temporal:
    stale_months_12: 12
    stale_months_60: 60

  taxonomic:
    # --- GBIF taxonomic backbone: Catalogue of Life Extended Release (COL XR) ---
    # GBIF permanently switched its default backbone to the COL Extended Release
    # (2025): the cube's `specieskey` is a COL taxonID — usually alphanumeric, but
    # some valid COL ids are purely numeric (e.g. Anemone nemorosa = 67343), so a
    # numeric key is NOT a legacy Backbone key. The cube SQL pins this checklist
    # explicitly via the classificationdetails selector (render_cube_sql ->
    # ${COL_CHECKLIST_KEY}). Drives name matching in 09a and provenance in 01b.
    # Update only if GBIF's default COL checklist key changes.
    col_checklist_key: "7ddf754f-d193-4cc9-b351-99906754a03b"
    # When true, kingdom-scopes the 06a/08 cube ("all") to backbone kingdoms.
    # Keep FALSE so the occurrence-based tabs report all of GBIF and dashboard
    # totals reconcile with the app; only Taxonomic/Concern are backbone-relative.
    restrict_to_backbone_scope: false
    min_occurrences: 10
    min_cells: 5
    gap_species_only: true                                 # keeps species/subspecies/variety/form ranks in the gap denominator
    exclude_kingdoms: ["Bacteria", "Archaea", "Viruses"]   # non-multicellular kingdoms to drop from the gap (national backbone may still list them)
    exclude_orders: ["Primates"]                           # drops Homo sapiens from the gap; CLEAR this list (or remove Primates) for countries with native non-human primates
    # "Poorly sampled" = bottom-quantile occurrences OR fewer than N cells.
    poorly_sampled_occ_quantile: 0.10
    poorly_sampled_min_cells: 3
    year_published_format: "mjd"     # Modified Julian Date — GBIF SQL API default

  processing:
    large_order_threshold: 500000
    low_memory_mode: false
    make_species_cell_time: true

# ============================================================================
# Marine / EEZ coverage (T-D5) - OPTIONAL, OFF BY DEFAULT
# ============================================================================
# When enabled, script 02 brings the country's empty sea cells (Marine Regions
# EEZ, or the 12 nm territorial sea) into the grid universe, so marine coverage
# and zero-coverage gaps are measured over the sea too. Needs the mregions2
# package (auto-fetch) OR a local file via marine.eez_file. Leave disabled for
# land-only countries - the rest of the pipeline is unchanged.
marine:
  enabled: false          # master switch (false = land-only grid, exactly as before)
  zone: "eez"             # "eez" (full EEZ) | "territorial" (12 nm)
  mrgid: null             # Marine Regions EEZ gazetteer id (required when zone: eez)
  # eez_file: ""          # optional: local EEZ GeoPackage/shapefile (skips download)
  # cql_filter: ""        # optional: raw ECQL filter for the WFS (overrides mrgid)
  force_download: false   # re-fetch even if a cached copy exists

# configs/config_NO.yml
# ============================================================================
# GBIF Gap Finder — Norway
# ============================================================================
# To run:
#   Sys.setenv(GBIF_GAP_COUNTRY = "NO")
#   source("scripts/00_setup.R")
#   source("scripts/01a_download_raw_data.R")
#
# Data: data/NO/raw/ and data/NO/proc/
# Grids: data/shared/grids/ (shared across European countries)
# ============================================================================

# ============================================================================
# Country Identification
# ============================================================================
country:
  code: "NO"
  name: "Norway"
  gbif_country_code: "NO"
  timezone: "Europe/Oslo"

# ============================================================================
# Administrative Boundaries
# ============================================================================
admin_boundaries:
  enabled: true
  country_code_iso3: "NOR"
  levels: [1, 2]
  force_download: false

# ============================================================================
# National Taxonomy Backbone
# ============================================================================
# Nortaxa — Artsnavnebasen (Norwegian Species Nomenclature Database)
# https://www.gbif.org/dataset/a6c6cead-b5ce-4a4e-8cf5-1542ba708dec
taxonomy:
  name: "Nortaxa"
  dataset_key: "a6c6cead-b5ce-4a4e-8cf5-1542ba708dec"
  doi: "https://doi.org/10.15468/4dd3tf"
  export_url: "https://ipt.artsdatabanken.no/archive.do?r=artsnavnebase"

# ============================================================================
# National Red List
# ============================================================================
# Norwegian Red List 2015 (latest DwC-A on GBIF; 2021 edition not yet on GBIF)
# https://www.gbif.org/dataset/4f1047ac-a19d-41a8-98eb-d968b2548b53
redlist:
  enabled: true
  dataset_key: "4f1047ac-a19d-41a8-98eb-d968b2548b53"
  doi: "https://doi.org/10.15468/mx9gdc"
  export_url: "https://ipt.gbif.no/archive.do?r=redlist-norway"

# ============================================================================
# National Invasive Species Registry
# ============================================================================
# GRIIS — Global Register of Introduced and Invasive Species - Norway
# https://www.gbif.org/dataset/38de3b7a-5af3-4b6f-a1c5-4c0aa6abf010
# Note: This is the GRIIS international checklist, not a national Norwegian
# registry. The isInvasive field indicates species with documented impact.
invasives:
  enabled: true
  dataset_key: "38de3b7a-5af3-4b6f-a1c5-4c0aa6abf010"
  doi: "https://doi.org/10.15468/9oaedf"
  export_url: "https://cloud.gbif.org/griis/archive.do?r=griis-brunei-norway"
  name: "GRIIS - Introduced and Invasive Species - Norway"

  
# ============================================================================
# Sensitive Species List (optional)
# ============================================================================
# Norway: No national sensitive/restricted species DwC-A checklist found on
# GBIF. The pipeline will run without it (is_sensitive = FALSE for all taxa).
sensitive:
  enabled: false
  dataset_key: ""
  doi: ""
  export_url: ""
  name: ""

# ============================================================================
# GBIF Occurrence Cubes (SQL API)
# ============================================================================
# NO cube provenance is recorded in the VERSION-CONTROLLED file
# provenance/cube_downloads_NO.yml (auto-written by 01a; seeded from NO's
# 2026-04-17 download). cube_download_key() reads it and 01b resolves DOI +
# citation from the key — nothing to hand-maintain here, and it can't go stale.
# To pin a specific download, add an override, e.g.:
#   grid10km: { download_key: "0025058-260409193756587" }
# Verify which is 10km vs 50km from your download — check the RESOLUTION
# value you used in each SQL query (10000 = 10km, 50000 = 50km).
cubes:
  source: "sql_api"

# ============================================================================
# Files
# ============================================================================
files:
  grids:
    grid10km: "Grid_ETRS89-LAEA_10K.shp"
    grid50km: "EEA_50km_grid_v2024.gpkg"

  cubes:
    grid10km: "cube_10km.csv"
    grid50km: "cube_50km.csv"

  taxonomy:
    taxonomy_taxon: "taxon.txt"
    taxonomy_distr: "distribution.txt"

  redlist:
    redlist_taxon: "taxon.txt"
    redlist_distr: "distribution.txt"

  invasives:
    invasives_taxon: "taxon.txt"
    invasives_distr: "distribution.txt"

  sensitive:
    sensitive_taxon: "taxon.txt"
    sensitive_distr: "distribution.txt"

# ============================================================================
# Analysis Parameters
# ============================================================================
parameters:
  crs: 3035

  spatial:
    quantile_thresholds: [0.05, 0.10, 0.25]

  temporal:
    stale_months_12: 12
    stale_months_60: 60

  taxonomic:
    # --- GBIF taxonomic backbone: Catalogue of Life Extended Release (COL XR) ---
    # GBIF's permanent default backbone (2025). The cube's `specieskey` is a COL
    # taxonID — usually alphanumeric, but some valid COL ids are purely numeric
    # (e.g. Anemone nemorosa = 67343), so a numeric key is NOT a legacy Backbone
    # key. The cube SQL pins this checklist explicitly via the classificationdetails
    # selector (render_cube_sql -> ${COL_CHECKLIST_KEY}). Used by 09a (name
    # matching) and 01b (provenance).
    col_checklist_key: "7ddf754f-d193-4cc9-b351-99906754a03b"
    # Keep FALSE so the occurrence tabs report ALL of GBIF (matches config_SE
    # + the 2026-07-21 decision). Code defaults TRUE, so NO must set it explicitly
    # or its occurrence tabs silently kingdom-scope.
    restrict_to_backbone_scope: false
    min_occurrences: 10
    min_cells: 5
    gap_species_only: true                                 # gap denominator = species-rank backbone taxa only
    exclude_kingdoms: ["Bacteria", "Archaea", "Viruses"]   # drop non-multicellular kingdoms from the gap
    exclude_orders: ["Primates"]                           # drop Homo sapiens from the gap denominator (no native non-human primates in Norway)
    # "Poorly sampled" (Priorities): bottom-quantile occurrences OR < N cells.
    poorly_sampled_occ_quantile: 0.10
    poorly_sampled_min_cells: 3

  processing:
    large_order_threshold: 500000
    low_memory_mode: false
    make_species_cell_time: true

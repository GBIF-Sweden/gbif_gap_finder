# configs/config_SE.yml
# ============================================================================
# GBIF Gap Analysis — Sweden
# ============================================================================

# ============================================================================
# Country Identification
# ============================================================================
country:
  code: "SE"
  name: "Sweden"
  gbif_country_code: "SE"
  timezone: "Europe/Stockholm"

# ============================================================================
# Administrative Boundaries
# ============================================================================
admin_boundaries:
  enabled: true
  country_code_iso3: "SWE"
  levels: [1, 2]
  force_download: false

# ============================================================================
# National Taxonomy Backbone
# ============================================================================
taxonomy:
  name: "Dyntaxa"
  dataset_key: "de8934f4-a136-481c-a87a-b0b202b80a31"
  doi: "https://doi.org/10.15468/j43wfc"
  export_url: https://api.artdatabanken.se/taxonservice/v1/DarwinCore/Download?subscription-key=4b068709e7f2427d9fc76bf42d8e2b57

# ============================================================================
# National Red List
# ============================================================================
redlist:
  enabled: true
  dataset_key: "fab88965-e69d-4491-a04d-e3198b626e52"
  doi: "https://doi.org/10.15468/jhwkpq"
  export_url: "https://www.gbif.se/ipt/archive.do?r=swedishredlist2020"

# ============================================================================
# National Invasive Species Registry
# ============================================================================
# Swedish registry of invasive alien species
# https://www.gbif.org/dataset/c1a61294-6195-4055-9b22-a2e48e5e16d7
invasives:
  enabled: true
  dataset_key: "c1a61294-6195-4055-9b22-a2e48e5e16d7"
  doi: "https://doi.org/10.15468/yxfse8"
  export_url: "https://www.gbif.se/ipt/archive.do?r=invasivespecies"
  name: "Swedish Invasive Species Registry"

# ============================================================================
# GBIF Occurrence Cubes (SQL API downloads)
# ============================================================================
cubes:
  source: "sql_api"
  grid10km:
    download_key: null
    doi: null
  grid50km:
    download_key: null
    doi: null

# ============================================================================
# Paths — All relative to data/{country_code}/
# ============================================================================
# These override the defaults in globals.R. If omitted, globals.R
# derives paths from data/{country_code}/raw/ and data/{country_code}/proc/.
# Uncomment only if you need non-standard locations.
#
# paths:
#   gbif_cube_dir: "data/SE/raw/cubes"
#   taxonomy_dir:  "data/SE/raw/taxonomy"
#   redlist_dir:   "data/SE/raw/redlist"
#   invasives_dir: "data/SE/raw/invasives"
#   admin_dir:     "data/SE/raw/admin"

# ============================================================================
# Files
# ============================================================================
files:
  grids:
    grid10km: "Grid_ETRS89-LAEA_10K.shp"
    grid50km: "EEA_50km_grid_v2024.gpkg"

  cubes:
    grid10km: "cube_10km.csv"
    grid50km: "cube_50km.csv"

  taxonomy:
    taxonomy_taxon: "Taxon.csv"
    taxonomy_distr: "SpeciesDistribution.csv"

  redlist:
    redlist_taxon: "taxon.txt"
    redlist_distr: "distribution.txt"

  invasives:
    invasives_taxon: "taxon.txt"
    invasives_distr: "distribution.txt"

# ============================================================================
# Derived Summaries
# ============================================================================
derived:
  dir: "derived"
  core:
    cell_summary_10km: "cell_summary_10km.csv"
    cell_summary_50km: "cell_summary_50km.csv"
    time_summary_10km: "time_summary_10km.csv"
    time_summary_50km: "time_summary_50km.csv"
    cell_time_summary_10km: "cell_time_summary_10km.csv"
    cell_time_summary_50km: "cell_time_summary_50km.csv"
    order_cell_summary_10km: "order_cell_summary_10km.csv"
    order_cell_summary_50km: "order_cell_summary_50km.csv"
    order_time_summary_10km: "order_time_summary_10km.csv"
    order_time_summary_50km: "order_time_summary_50km.csv"
    family_time_summary_10km: "family_time_summary_10km.csv"
    family_time_summary_50km: "family_time_summary_50km.csv"
    cube_key_summary: "cube_key_summary.csv"
    grid_lookup_10km: "grid_lookup_10km.csv"
    grid_lookup_50km: "grid_lookup_50km.csv"

  species:
    by_order_dir: "by_order"
    by_family_dir: "by_family"
    types:
      - species_summary
      - species_cell
      - species_time
      - species_cell_time

# ============================================================================
# Gap Analysis Outputs
# ============================================================================
gaps:
  dir: "gaps"
  outputs:
    spatial_gaps_10km: "spatial_gaps_10km.csv"
    spatial_gaps_50km: "spatial_gaps_50km.csv"
    spatial_thresholds_by_basis: "spatial_thresholds_by_basis.csv"
    spatial_summary_by_basis: "spatial_summary_by_basis.csv"
    spatial_summary_by_grid: "spatial_summary_by_grid.csv"
    spatial_zero_coverage_cells: "spatial_zero_coverage_cells.csv"
    spatial_low_coverage_cells_q10: "spatial_low_coverage_cells_q10.csv"
    temporal_overview_year_10km: "temporal_overview_year_10km.csv"
    temporal_overview_year_50km: "temporal_overview_year_50km.csv"
    temporal_overview_month_10km: "temporal_overview_month_10km.csv"
    temporal_overview_month_50km: "temporal_overview_month_50km.csv"
    temporal_year_by_basis_10km: "temporal_year_by_basis_10km.csv"
    temporal_year_by_basis_50km: "temporal_year_by_basis_50km.csv"
    temporal_month_by_basis_10km: "temporal_month_by_basis_10km.csv"
    temporal_month_by_basis_50km: "temporal_month_by_basis_50km.csv"
    temporal_year_month_10km: "temporal_year_month_10km.csv"
    temporal_year_month_50km: "temporal_year_month_50km.csv"
    temporal_decade_summary_10km: "temporal_decade_summary_10km.csv"
    temporal_decade_summary_50km: "temporal_decade_summary_50km.csv"
    temporal_year_completeness_10km: "temporal_year_completeness_10km.csv"
    temporal_year_completeness_50km: "temporal_year_completeness_50km.csv"
    temporal_month_completeness_10km: "temporal_month_completeness_10km.csv"
    temporal_month_completeness_50km: "temporal_month_completeness_50km.csv"
    temporal_gap_years_detail: "temporal_gap_years_detail.csv"
    temporal_gap_years_summary: "temporal_gap_years_summary.csv"
    temporal_sampling_frequency_summary: "temporal_sampling_frequency_summary.csv"
    temporal_year_by_family_10km: "temporal_year_by_family_10km.csv"
    temporal_year_by_family_50km: "temporal_year_by_family_50km.csv"
    cell_recency_10km: "cell_recency_10km.csv"
    cell_recency_50km: "cell_recency_50km.csv"
    taxonomic_match_table: "taxonomic_match_table.csv"
    taxonomic_match_summary: "taxonomic_match_summary.csv"
    taxonomic_missing_taxa: "taxonomic_missing_taxa.csv"
    taxonomic_missing_threatened: "taxonomic_missing_threatened.csv"
    taxonomic_gap_summary: "taxonomic_gap_summary.csv"
    taxonomic_coverage_by_rank: "taxonomic_coverage_by_rank.csv"
    taxonomic_coverage_by_threat: "taxonomic_coverage_by_threat.csv"
    taxonomic_coverage_by_basis: "taxonomic_coverage_by_basis.csv"
    taxonomic_spatial_coverage: "taxonomic_spatial_coverage.csv"
    taxonomic_threatened_spatial_coverage: "taxonomic_threatened_spatial_coverage.csv"
    taxonomic_gaps_by_family: "taxonomic_gaps_by_family.csv"
    taxonomic_gaps_by_order: "taxonomic_gaps_by_order.csv"
    taxonomic_priority_taxa: "taxonomic_priority_taxa.csv"

# ============================================================================
# Overview Outputs
# ============================================================================
overview:
  dir: "tables"
  outputs:
    dashboard_summary: "dashboard_summary.csv"
    comparison_grid_resolutions: "comparison_grid_resolutions.csv"
    comparison_basis_types: "comparison_basis_types.csv"
    comparison_taxon_ranks: "comparison_taxon_ranks.csv"
    overview_spatial_gap_rates: "overview_spatial_gap_rates.csv"
    overview_temporal_year: "overview_temporal_year.csv"
    overview_temporal_month: "overview_temporal_month.csv"
    overview_temporal_recency_rates: "overview_temporal_recency_rates.csv"
    overview_taxonomic_summary: "overview_taxonomic_summary.csv"
    overview_missing_taxa: "overview_missing_taxa.csv"
    space_time_basis_10km: "integrated/space_time_basis_10km.csv"
    space_time_basis_50km: "integrated/space_time_basis_50km.csv"
    space_taxonomy_simple_10km: "integrated/space_taxonomy_simple_10km.csv"
    space_taxonomy_basis_10km: "integrated/space_taxonomy_basis_10km.csv"
    time_taxonomy_basis_10km: "integrated/time_taxonomy_basis_10km.csv"
    priority_zero_coverage_cells: "integrated/priority_zero_coverage_cells.csv"
    priority_undersampled_taxa: "integrated/priority_undersampled_taxa.csv"
    priority_stale_cells: "integrated/priority_stale_cells.csv"

# ============================================================================
# Analysis Parameters
# ============================================================================
parameters:
  crs: 3035
  spatial:
    quantile_thresholds: [0.05, 0.10, 0.25]
  temporal:
    stale_months_12: 12
    stale_months_60: 60
  taxonomic:
    min_occurrences: 1
    min_cells: 1
  processing:
    large_order_threshold: 500000
    low_memory_mode: false
    make_species_cell_time: true

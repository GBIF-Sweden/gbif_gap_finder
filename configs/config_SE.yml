# configs/config_SE.yml
# ============================================================================
# GBIF Gap Finder — Sweden
# ============================================================================

# ============================================================================
# Country Identification
# ============================================================================
country:
  code: "SE"
  name: "Sweden"
  gbif_country_code: "SE"
  timezone: "Europe/Stockholm"

# ============================================================================
# Administrative Boundaries
# ============================================================================
admin_boundaries:
  enabled: true
  country_code_iso3: "SWE"
  levels: [1, 2]
  force_download: false

# ============================================================================
# National Taxonomy Backbone
# ============================================================================
taxonomy:
  name: "Dyntaxa"
  dataset_key: "de8934f4-a136-481c-a87a-b0b202b80a31"
  # DOI + citation are resolved from dataset_key by 01b_resolve_data_sources.R.
  # Do not hand-maintain a doi here — it drifts when the dataset is re-versioned.
  export_url: "https://api.artdatabanken.se/taxonservice/v1/DarwinCore/Download?subscription-key=4b068709e7f2427d9fc76bf42d8e2b57"
# ============================================================================
# National Red List
# ============================================================================
redlist:
  enabled: true
  dataset_key: "87e639cc-30a9-4007-bd2c-b0cab60326b9"
  export_url: "https://www.gbif.se/ipt/archive.do?r=swedishredlist2025"

# ============================================================================
# National Invasive Species Registry
# ============================================================================
# Swedish registry of invasive alien species
# https://www.gbif.org/dataset/c1a61294-6195-4055-9b22-a2e48e5e16d7
invasives:
  enabled: true
  dataset_key: "c1a61294-6195-4055-9b22-a2e48e5e16d7"
  export_url: "https://cloud.gbif.org/griis/archive.do?r=griis-sweden"
  name: "Swedish Invasive Species Registry"

# ============================================================================
# Sensitive Species (Restricted Access)
# ============================================================================
# SLU Artdatabanken list of species with restricted locality data.
# 203 species with sensitivity categories (5 km, 25 km, 50 km generalization).
# https://www.gbif.org/dataset/0bfa983c-1ef3-4ade-8b07-13d4365f11ff
sensitive:
  enabled: true
  dataset_key: "0bfa983c-1ef3-4ade-8b07-13d4365f11ff"
  export_url: "https://www.gbif.se/ipt/archive.do?r=sensitivespecies"
  name: "List of Restricted Access Species In Sweden"

# ============================================================================
# GBIF Occurrence Cubes (SQL API downloads)
# ============================================================================
cubes:
  source: "sql_api"
  # No download_key here. 01a's occ_download_sql() automation records the key of
  # every download to the VERSION-CONTROLLED file provenance/cube_downloads_SE.yml,
  # and cube_download_key() (globals.R) reads it — so provenance auto-tracks the
  # cube on disk, is committed with the code, and can never go stale here. 01b
  # resolves + validates DOI/citation/records from that key and fails loudly if a
  # key is wrong or from a test instance.
  # To PIN a specific historical download instead, add an override, e.g.:
  #   grid10km: { download_key: "0017309-260721160103020" }

# ============================================================================
# Paths — All relative to data/{country_code}/
# ============================================================================
# These override the defaults in globals.R. If omitted, globals.R
# derives paths from data/{country_code}/raw/ and data/{country_code}/proc/.
# Uncomment only if you need non-standard locations.
#
# paths:
#   gbif_cube_dir: "data/SE/raw/cubes"
#   taxonomy_dir:  "data/SE/raw/taxonomy"
#   redlist_dir:   "data/SE/raw/redlist"
#   invasives_dir: "data/SE/raw/invasives"
#   admin_dir:     "data/SE/raw/admin"

# ============================================================================
# Files
# ============================================================================
files:
  grids:
    grid10km: "Grid_ETRS89-LAEA_10K.shp"
    grid50km: "EEA_50km_grid_v2024.gpkg"

  cubes:
    grid10km: "cube_10km.csv"
    grid50km: "cube_50km.csv"

  taxonomy:
    taxonomy_taxon: "Taxon.csv"
    taxonomy_distr: "SpeciesDistribution.csv"

  redlist:
    redlist_taxon: "taxon.txt"
    redlist_distr: "distribution.txt"

  invasives:
    invasives_taxon: "taxon.txt"
    invasives_distr: "distribution.txt"

  sensitive:
    sensitive_taxon: "taxon.txt"
    sensitive_distr: "distribution.txt"

# ============================================================================
# Gap Analysis Outputs
# ============================================================================
# H7 trim (2026-07-30): the former derived / gaps.outputs / overview.outputs
# name->filename manifest was inert - every output path is hard-coded in the
# scripts (p_derived / p_gaps / p_tables in R/globals.R) and the lists had
# drifted. Only the key below is read (cfg_get in 09a). Add a key back here
# only if a script starts reading it via cfg_get("gaps.outputs.<key>").
gaps:
  outputs:
    taxonomic_match_table: "taxonomic_match_table.csv"

# ============================================================================
# Analysis Parameters
# ============================================================================
parameters:
  crs: 3035
  spatial:
    quantile_thresholds: [0.05, 0.10, 0.25]
  temporal:
    stale_months_12: 12
    stale_months_60: 60
  taxonomic:
    # --- GBIF taxonomic backbone: Catalogue of Life Extended Release (COL XR) ---
    # GBIF permanently switched its default backbone to the COL Extended Release
    # (2025). The occurrence cube's `specieskey` is a COL taxonID — usually
    # alphanumeric (e.g. "6VFN8"), but some valid COL ids are purely NUMERIC
    # (e.g. Anemone nemorosa = 67343), so a numeric key is NOT a legacy Backbone
    # key. The cube SQL pins this checklist EXPLICITLY via the classificationdetails
    # selector (sql/gbif_occurrence_cube.sql; render_cube_sql -> ${COL_CHECKLIST_KEY}),
    # so the backbone is a version-controlled choice, not a dependency on GBIF's
    # mutable default. Drives (a) name matching in 09a and (b) provenance in 01b.
    col_checklist_key: "7ddf754f-d193-4cc9-b351-99906754a03b"
    # Occurrence-based tabs (Overview/Spatial/Temporal/Record Types/Publisher)
    # report ALL of GBIF; only Taxonomic + Species-of-Concern are backbone-
    # relative. When true, this switch kingdom-scopes the 06a/08 cube ("all") to
    # backbone kingdoms. Set FALSE so "all" is genuinely all of GBIF and the
    # dashboard totals reconcile with the app. (Project decision 2026-07-21.)
    restrict_to_backbone_scope: false
    min_occurrences: 1
    min_cells: 1
    # Taxonomic-gap denominator keeps backbone taxa at species/subspecies/variety/
    # form rank (all four — see 09b:241). Microbial kingdoms + Primates excluded.
    gap_species_only: true
    exclude_kingdoms: ["Bacteria", "Archaea", "Viruses"]   # drop non-multicellular kingdoms from the gap
    exclude_orders: ["Primates"]
    # "Poorly sampled" (Priorities): a matched taxon in the bottom quantile of
    # occurrences OR occupying fewer than N cells. (Project decision 2026-07-21.)
    poorly_sampled_occ_quantile: 0.10
    poorly_sampled_min_cells: 3
  processing:
    large_order_threshold: 500000
    low_memory_mode: false
    make_species_cell_time: true

# ============================================================================
# Marine / EEZ coverage (T-D5)
# ============================================================================
# Bring Sweden's empty Baltic/Skagerrak/Kattegat sea cells into the grid so
# marine coverage + zero-coverage gaps are measured. Fetches the Swedish EEZ
# (Marine Regions MRGID 5694) via mregions2 and caches it under
# data/SE/raw/marine/. Set enabled: false to fall back to a land-only grid.
marine:
  enabled: true
  zone: "eez"
  mrgid: 5694             # Swedish Exclusive Economic Zone (Marine Regions)
  force_download: false

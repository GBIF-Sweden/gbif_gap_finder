# config_template.yml
# ============================================================================
# gbifgaps — Configuration Template
# ============================================================================
# Copy this file to config.yml and fill in values for your country.
#
# Required steps:
#   1. Set your country code and name
#   2. Find your national taxonomy on GBIF (dataset key + DwC-A URL)
#   3. Find your national red list on GBIF (or set enabled: false)
#   4. Request GBIF occurrence cube downloads for your country
#   5. Download EEA grids clipped to your country
#   6. Update file names to match your actual downloads
#
# Lines marked # CHANGE are the ones you must edit.
# Lines marked # OPTIONAL can be left as defaults.
# ============================================================================

# ============================================================================
# Country Identification
# ============================================================================
country:
  code: "XX"                         # CHANGE — ISO 3166-1 alpha-2 (SE, NO, FI, DE, ...)
  name: "Your Country"               # CHANGE — used in plot titles and messages
  gbif_country_code: "XX"            # CHANGE — usually same as code
  timezone: "Europe/London"          # CHANGE — your local timezone

# ============================================================================
# National Taxonomy Backbone
# ============================================================================
# This is your country's authoritative species checklist, published as a
# Darwin Core Archive (DwC-A) on GBIF. The pipeline expects a Taxon.csv
# and optionally a Distribution.csv inside the archive.
#
# How to find yours:
#   1. Go to https://www.gbif.org/dataset/search?type=CHECKLIST
#   2. Filter by your country's publishing organisation
#   3. Look for the national species checklist / taxonomic backbone
#   4. Copy the dataset key from the URL (the UUID after /dataset/)
#   5. Find the DwC-A download URL on the dataset's page
#
# Examples:
#   Sweden:  Dyntaxa          — de8934f4-a136-481c-a87a-b0b202b80a31
#   Norway:  Nortaxa          — a6c6cead-b5ce-4a4e-8cf5-1542ba708dec
#   Finland: FinBIF taxonomy  — not published as a single DwC-A on GBIF
#                                (would need custom adapter in script 03)
taxonomy:
  name: "Your National Taxonomy"     # CHANGE — human-readable name
  dataset_key: ""                    # CHANGE — GBIF dataset UUID
  doi: ""                            # CHANGE — e.g. https://doi.org/10.15468/xxxxx
  export_url: ""                     # CHANGE — DwC-A download URL
  version: "1.0"                     # OPTIONAL — version of the export

# ============================================================================
# National Red List (threat status enrichment)
# ============================================================================
# If your country publishes a red list as a DwC-A on GBIF, enable this to
# add threat status (CR, EN, VU, NT, LC) to the taxonomic gap analysis.
# If unavailable, set enabled: false and the pipeline runs without it.
redlist:
  enabled: true                      # CHANGE — set false if no red list available
  dataset_key: ""                    # CHANGE — GBIF dataset UUID
  doi: ""                            # CHANGE
  export_url: ""                     # CHANGE — DwC-A download URL

# ============================================================================
# GBIF Occurrence Cubes
# ============================================================================
# Request species occurrence cube downloads from GBIF, filtered to your
# country code. These are CSV downloads aggregated to EEA grid cells.
#
# How to request:
#   1. Go to https://www.gbif.org/occurrence/download
#   2. Filter: countryCode = XX, basisOfRecord = as needed
#   3. Download as "Species" cube on EEA grid
#   4. Record the DOI for each resolution
#
# You need one cube per grid resolution you want to analyse.
cubes:
  resolutions:
    - resolution: 10                 # CHANGE — DOI of your 10km cube download
      doi: ""
    - resolution: 50                 # CHANGE — DOI of your 50km cube download
      doi: ""

# ============================================================================
# Paths
# ============================================================================
# These defaults work for most setups. Change only if your directory
# structure differs.
paths:
  data_raw: "data_raw"               # OPTIONAL
  data_proc: "data_proc"             # OPTIONAL
  output: "output"                   # OPTIONAL
  logs: "logs"                       # OPTIONAL

  # Raw data subdirectories — adjust names to match your downloads
  gbif_cube_dir: "data_raw/gbif_occurrence_cubes"
  grid_10km_dir: "data_raw/eea_grid_10km"  # CHANGE if not using EEA grids
  grid_50km_dir: "data_raw/eea_grid_50km"

  # National datasets — name these whatever makes sense for your country
  taxonomy_dir: "data_raw/taxonomy"  # CHANGE — where you unzip the DwC-A
  redlist_dir: "data_raw/redlist"    # CHANGE

# ============================================================================
# Files
# ============================================================================
files:
  # EEA grids — file names depend on what you download
  grids:
    grid10km: "xx_10km.shp"          # CHANGE — your 10km grid shapefile
    grid50km: "EEA_50km_grid_v2024.gpkg"  # CHANGE if needed

  # GBIF cube CSV files — one per basisOfRecord × resolution
  # Adjust to match whatever cubes you downloaded.
  # Remove any basisOfRecord types you don't have.
  cube_files:
    grid10km:
      occurrence: "species_occurrences_10km.csv"         # CHANGE
      humanObservation: "species_humanObservation_10km.csv"
      preservedSpecimen: "species_preservedSpecimen_10km.csv"
    grid50km:
      occurrence: "species_occurrences_50km.csv"
      humanObservation: "species_humanObservation_50km.csv"
      preservedSpecimen: "species_preservedSpecimen_50km.csv"

  # Taxonomy DwC-A file names (inside the unzipped archive)
  taxonomy:
    taxonomy_taxon: "Taxon.csv"              # CHANGE if different
    taxonomy_distr: "Distribution.csv"       # CHANGE — or remove if not present

  # Red list DwC-A file names
  redlist:
    redlist_taxon: "Taxon.csv"               # CHANGE if different
    redlist_distr: "Distribution.csv"        # CHANGE

# ============================================================================
# Analysis Parameters
# ============================================================================
# These defaults are sensible for most European countries. Adjust thresholds
# based on your data volume and analysis needs.
parameters:
  crs: 3035                          # ETRS89-LAEA (EEA standard for Europe)
                                     # CHANGE for non-European countries

  spatial:
    quantile_thresholds: [0.05, 0.10, 0.25]  # OPTIONAL

  temporal:
    stale_months_12: 12              # OPTIONAL — "recent" threshold
    stale_months_60: 60              # OPTIONAL — "stale" threshold

  taxonomic:
    min_occurrences: 10              # OPTIONAL
    min_cells: 5                     # OPTIONAL
    api_min_occurrences: 10          # OPTIONAL — Tier 4: skip API below this
    api_max_requests: 5000           # OPTIONAL — Tier 4: max API calls per run

  processing:
    large_order_threshold: 500000    # OPTIONAL — split large orders by family
    low_memory_mode: false           # Set true for <16 GB RAM
    make_species_cell_time: true     # Set false to skip the largest output

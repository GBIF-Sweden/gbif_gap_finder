paths:
  # Project folders
  data_raw: "data_raw"
  data_proc: "data_proc"
  output: "output"
  logs: "logs"

  # Raw dataset folders
  gbif_cube_dir: "data_raw/gbif_occurrence_cubes"
  grid_10km_dir: "data_raw/eea_grid_10km"
  grid_50km_dir: "data_raw/eea_grid_50km"
  redlist_se_dir: "data_raw/red_list_se"
  redlist_iucn_dir: "data_raw/red_list_iucn"
  dyntaxa_dir: "data_raw/dyntaxa"

files:
  # EEA grids
  grids:
    grid10km: "se_10km.shp"
    grid50km: "EEA_50km_grid_v2024.gpkg"
  # GBIF occurrence cube
  cube_files:
    grid10km:
      occurrence: "species_occurrences_10km.csv"
      observation: "species_observation_10km.csv"
      humanObservation: "species_humanObservation_10km.csv"
      machineObservation: "species_machineObservation_10km.csv"
      materialSample: "species_materialSample_10km.csv"
      materialCitation: "species_materialCitation_10km.csv"
      preservedSpecimen: "species_preservedSpecimen_10km.csv"
      livingSpecimen: "species_livingSpecimen_10km.csv"
      fossilSpecimen: "species_fossilSpecimen_10km.csv"
    grid50km:
      occurrence: "species_occurrences_50km.csv"
      observation: "species_observation_50km.csv"
      humanObservation: "species_humanObservation_50km.csv"
      machineObservation: "species_machineObservation_50km.csv"
      materialSample: "species_materialSample_50km.csv"
      materialCitation: "species_materialCitation_50km.csv"
      preservedSpecimen: "species_preservedSpecimen_50km.csv"
      livingSpecimen: "species_livingSpecimen_50km.csv"
      fossilSpecimen: "species_fossilSpecimen_50km.csv"
  # Swedish Red List (your two files A + B)
  redlist_se:
    redlist_se_distr: "distribution.txt"
    redlist_se_taxon: "taxon.txt"
    
derived:
  dir: "derived"

  # Phase 2 outputs (analysis-ready summaries)
  outputs:
    # Core summaries
    cell_summary_10km: "cell_summary_10km.csv"
    cell_summary_50km: "cell_summary_50km.csv"

    time_summary_10km: "time_summary_10km.csv"
    time_summary_50km: "time_summary_50km.csv"

    species_summary_10km: "species_summary_10km.csv"
    species_summary_50km: "species_summary_50km.csv"

    cube_key_summary: "cube_key_summary.csv"

    grid_lookup_10km: "grid_lookup_10km.csv"
    grid_lookup_50km: "grid_lookup_50km.csv"

    # taxonomic rank × time summaries
    family_time_summary_10km: "family_time_summary_10km.csv"
    family_time_summary_50km: "family_time_summary_50km.csv"

    order_time_summary_10km: "order_time_summary_10km.csv"
    order_time_summary_50km: "order_time_summary_50km.csv"

    # OPTIONAL: species × time summary (top N species only)
    species_time_summary_topN_10km: "species_time_summary_topN_10km.csv"
    species_time_summary_topN_50km: "species_time_summary_topN_50km.csv"

# Dependabot keeps the pinned external versions moving forward on a schedule
# instead of rotting until something breaks.
version: 2
updates:
  # GitHub Actions used by publish-shiny-images.yml, citation-version.yml and
  # build-image-pr.yml.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "ci"]

  # Base image in shiny_app/gap_finder/Dockerfile.gap_finder (FROM rocker/r-ver).
  # The Dockerfile has a non-standard name; Dependabot does match it.
  - package-ecosystem: "docker"
    directory: "/shiny_app/gap_finder"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build"
    labels: ["dependencies", "docker"]
    ignore:
      # An R minor/major bump is not a dependency update - it swaps the R version
      # inside the production image. Every renv.lock package recompiles against
      # the new R, the image's pinned CRAN snapshot date moves forward, and the
      # Ubuntu base may move, taking the apt GDAL/GEOS/PROJ with it.
      # That is a deliberate exercise, taken together with the local R and a
      # re-resolved renv.lock - not something to merge from a bot PR.
      #
      # Patch bumps (4.6.2 -> 4.6.3) still arrive, and so do digest-only updates:
      # rocker re-pushes the tag of its newest R release (rocker/r-ver:4.6.2 was
      # rebuilt on 2026-10-29 and 2026-11-08). A patch bump can move the Ubuntu
      # base as well (4.6.1 is on 24.04 noble, 4.6.2 on 26.04 resolute), so read
      # the Build Image (PR) run before merging one.
      - dependency-name: "rocker/r-ver"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

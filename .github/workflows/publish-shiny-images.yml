name: Publish Shiny Images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-shiny-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate Release Inputs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Dockerfiles and app bundles
        run: |
          test -f shiny_app/gap_app/Dockerfile.gap_app
          test -f shiny_app/gbif_explorer/Dockerfile.gbif_explorer
          test -f shiny_app/gap_app/app.R
          test -f shiny_app/gbif_explorer/app.R
          test -f shiny_app/gap_app/data/shiny_data.rds
          test -f shiny_app/gbif_explorer/data/shiny_data.rds

  publish:
    name: Publish ${{ matrix.image_name }}
    runs-on: ubuntu-latest
    needs: validate-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: gap-app
            dockerfile: shiny_app/gap_app/Dockerfile.gap_app
          - image_name: gbif-explorer
            dockerfile: shiny_app/gbif_explorer/Dockerfile.gbif_explorer

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Normalize image owner
        id: vars
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.image_name }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=${{ matrix.image_name }}
            org.opencontainers.image.description=Shiny application image for gbif_data_gaps
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_name }}

name: Publish Shiny Images

# Action versions: all five actions below are pinned to their Node 24 majors.
# GitHub removes retired Node runtimes from its runners, and an action whose
# major declares one (`using: node20`) stops working; keep every action on a
# current major.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

# Country whose bundle + config the published image is built for. The pipeline,
# the app, and the Dockerfile all key off GBIF_GAP_COUNTRY (see R/globals.R).
env:
  GBIF_GAP_COUNTRY: SE

concurrency:
  group: publish-shiny-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate Release Inputs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Verify Dockerfiles and app bundles
        run: |
          test -f shiny_app/gap_finder/Dockerfile.gap_finder
          test -f shiny_app/gap_finder/app.R
          test -f shiny_app/gap_finder/data/${GBIF_GAP_COUNTRY}/shiny_data.rds
          # Guard against an un-fetched LFS pointer: the real bundle is ~90 MB,
          # an LFS pointer stub is ~130 bytes. Fail loudly if we got the stub.
          test "$(stat -c%s shiny_app/gap_finder/data/${GBIF_GAP_COUNTRY}/shiny_data.rds)" -gt 1000000

  publish:
    name: Publish gap-finder
    runs-on: ubuntu-latest
    needs: validate-release

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Normalize image owner
        id: vars
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The system libraries and R packages come from the prebuilt deps image
      # (build-deps-image.yml), so this job needs no Ubuntu, Docker Hub or Posit
      # server. The image is named after the Dockerfile and renv.lock of this
      # commit.
      - name: Find the deps image
        id: deps
        run: |
          image=$(bash .github/scripts/deps_image.sh)
          if ! docker buildx imagetools inspect "$image" > /dev/null 2>&1; then
            echo "::error::$image is not on GHCR. Wait for the 'Build deps image' run on main to finish (or start it: Actions > Build deps image > Run workflow), then re-run this job."
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.vars.outputs.owner }}/gap-finder
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=gap-finder
            org.opencontainers.image.description=GBIF Gap Finder - Dashboard
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.base.name=${{ steps.deps.outputs.image }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: shiny_app/gap_finder/Dockerfile.gap_finder
          build-args: |
            RUNTIME=${{ steps.deps.outputs.image }}
            GBIF_GAP_COUNTRY=${{ env.GBIF_GAP_COUNTRY }}
            GAP_FINDER_VERSION=${{ github.ref_name }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

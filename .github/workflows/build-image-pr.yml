name: Build Image (PR)

# Why this exists: publish-shiny-images.yml only runs on `v*` tags, so without
# this workflow a Dependabot PR against the Dockerfile would show a green check
# that had verified nothing at all. A base-image or renv.lock change that breaks
# renv::restore() would surface at the next release tag, mid-release.
#
# This builds up to the RUNTIME STAGE (`target: runtime`): the apt system
# libraries plus renv::restore() under whatever R the base image carries, then
# the runtime libraries and a check that every compiled package finds the
# shared libraries it needs there. That is precisely what an R or Ubuntu bump
# can break, and it needs neither the ~90 MB Git LFS bundle nor the country
# config - so no LFS bandwidth is spent per PR and nothing is pushed to GHCR.
# No layer cache: GitHub's cache is scoped to the branch, so a PR build could
# never read one written elsewhere, and a full build is what this check is for.
on:
  pull_request:
    paths:
      - "shiny_app/gap_finder/Dockerfile.gap_finder"
      - "renv.lock"
      - ".github/workflows/build-image-pr.yml"

permissions:
  contents: read

concurrency:
  group: build-image-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build builder and runtime stages
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The builder and runtime stages copy only renv.lock, so the LFS data
          # bundle is not needed here. Explicit, because the release workflow
          # does need it.
          lfs: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build up to the runtime stage (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: shiny_app/gap_finder/Dockerfile.gap_finder
          target: runtime
          push: false
          platforms: linux/amd64

name: Build Image (PR)

# Why this exists: publish-shiny-images.yml only runs on `v*` tags, so without
# this workflow a Dependabot PR against the Dockerfile would show a green check
# that had verified nothing at all. A base-image or renv.lock change that breaks
# renv::restore() would surface at the next release tag, mid-release.
#
# This builds up to the RUNTIME STAGE (`target: runtime`): the apt system
# libraries plus renv::restore() under whatever R the base image carries, then
# the runtime libraries and a check that every compiled package finds the
# shared libraries it needs there. That is precisely what an R or Ubuntu bump
# can break, and it needs neither the ~90 MB Git LFS bundle nor the country
# config - so no LFS bandwidth is spent per PR and nothing is pushed to GHCR.
on:
  pull_request:
    paths:
      - "shiny_app/gap_finder/Dockerfile.gap_finder"
      - "shiny_app/gap_finder/docker/**"
      - "renv.lock"
      - ".github/workflows/build-image-pr.yml"

permissions:
  contents: read

concurrency:
  group: build-image-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build builder and runtime stages
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The builder and runtime stages copy only renv.lock, so the LFS data
          # bundle is not needed here. Explicit, because the release workflow
          # does need it.
          lfs: false

      # The apt fallback chain (docker/apt_install.sh) ends with Ubuntu mirrors
      # run by others. That step only runs when all of Canonical is down, so it
      # is checked here: Canonical's hosts are blocked and each mirror installs
      # one package. A failing mirror gets a warning; the step fails only when
      # no mirror works.
      - name: Check the apt mirror fallback (Canonical blocked)
        run: |
          df=shiny_app/gap_finder/Dockerfile.gap_finder
          base=$(sed -n 's/^FROM \(rocker\/r-ver[^ ]*\) AS builder$/\1/p' "$df")
          snapshot=$(sed -n 's/^ARG APT_SNAPSHOT=//p' "$df")
          mirrors=$(sed -n 's/^APT_MIRRORS_DEFAULT="\(.*\)"$/\1/p' shiny_app/gap_finder/docker/apt_install.sh)
          test -n "$base"
          test -n "$snapshot"
          test -n "$mirrors"
          ok=0
          for m in $mirrors; do
            if docker run --rm --platform linux/amd64 \
                 --add-host snapshot.ubuntu.com:127.0.0.1 \
                 --add-host archive.ubuntu.com:127.0.0.1 \
                 --add-host security.ubuntu.com:127.0.0.1 \
                 -e APT_SNAPSHOT="$snapshot" -e APT_RETRIES=1 -e APT_MIRRORS="$m" \
                 -v "$PWD/shiny_app/gap_finder/docker:/x:ro" "$base" \
                 sh /x/apt_install.sh libgeos-dev; then
              ok=$((ok + 1))
            else
              echo "::warning::apt mirror $m failed with Canonical's hosts blocked"
            fi
          done
          test "$ok" -gt 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build up to the runtime stage (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: shiny_app/gap_finder/Dockerfile.gap_finder
          target: runtime
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=gap-finder
          cache-to: type=gha,mode=max,scope=gap-finder-pr
